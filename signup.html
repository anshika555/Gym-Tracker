<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="register.css" >
<body>
    <nav class="navbar">

    <div class="logo">
        <span><a href="Homepage.html"><img src="images/image1.jpeg"></a></span> FITTRACK
    </div>

    <div class="nav-links">
        <a href="Homepage.html">Home</a>
        <a href="About.html">About Us</a>
        <a href="signup.html" class="login-btn">Login</a>
        <a href="signup.html" class="signup-btn">Sign Up</a>
    </div>

</nav>
    <div class="account-page">
        <div class="form">
            <div class="row">
                <div class="col-2">
                    <div class="form-container">
                        <h1>Sign-up</h1>
                        <form class="form-part1">
                            <label>Nickname:</label>
                            <input type="text">
                            <br>
                            <label>Age:</label>
                            <input type="num">
                            <br>
                            <label>Gender:</label>
                            <input type="radio" name="gender">M
                            <input type="radio" name="gender">F
                            <br>
                            <label>Height(in cms):</label>
                            <input type="num">
                            <br>
                            <label>Weight(in kg):</label>
                            <input type="num">
                            <br>
                            <label>Email:</label>
                            <input type="email">
                            <br>
                            <label>Password:</label>
                            <input type="password" minlength="8" required>
                            <br> 
                            <br>
                            <label>Confirm Password:</label>
                            <input type="password" minlength="8" required>
                            <br>
                        </form>
                        <hr>
                        <form class="form-part2">
                            <h3>Where do you stand?</h3>
                            <input type="radio" name="stand">Beginner
                            <input type="radio" name="stand">Senior ( 6+ months )
                            <input type="radio" name="stand">Expert ( 1+ years )
                            <br>
                            <h3>What is your goal?</h3>
                            <input type="radio" name="goal">Gaining
                            <input type="radio" name="goal">Cutting
                            <br>
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                            <br>
                            <br>
                            <b>Already have an account?Sign in below </b> 
            
                        </form>
                        
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    <div class="account-page">
        <div class="form">
            <div class="row">
                <div class="col-2">
                    <div class="form-container">
                        <h1>Login</h1>
                        <form class="form-part1">
                            <label>Email:</label>
                            <input type="email">
                            <br>
                            <label>Password:</label>
                            <input type="password">
                            <br>
                            <br>
                            <button>Login</button> 
                        </form>
                        <hr>
                        
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
        <footer>

        <p>
            © 2026 FitTrack | Your Fitness Companion
        </p>

    </footer>
    
        

    
        

</body>
    

</html>
